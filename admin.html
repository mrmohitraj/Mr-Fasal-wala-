<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Mr Fasal Wala</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2E7D32">
<link rel="icon" href="icon-192.png">
<style>
  :root{--green:#2E7D32;--green-800:#1B5E20;--cream:#FFF8E1;--ink:#1E2A1E;--ink-soft:#5B6B5B;--line:#E4DCC3;--white:#fff;--danger:#D64545;--radius:14px;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
  header{background:var(--green-800);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px;}
  header a{color:#fff;text-decoration:none;font-size:14px;opacity:.9;}
  header h1{font-family:'Baloo 2',sans-serif;font-size:19px;margin:0;flex:1;}
  main{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  h2{font-family:'Baloo 2',sans-serif;font-size:18px;margin:0 0 14px;color:var(--green-800);}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;}
  input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;background:#fff;}
  input[type=checkbox]{width:auto;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .checkbox-row label{margin:0;font-weight:500;}
  button{cursor:pointer;border:none;font-family:inherit;}
  .btn{width:100%;padding:13px;border-radius:999px;background:var(--green);color:#fff;font-weight:700;font-size:14.5px;margin-top:16px;}
  .btn:disabled{opacity:.6;}
  .btn--outline{background:#fff;color:var(--green-800);border:1.5px solid var(--green-800);padding:7px 12px;font-size:12px;font-weight:700;border-radius:999px;width:auto;margin-top:0;}
  .btn--danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger);padding:7px 12px;font-size:12px;font-weight:700;border-radius:999px;width:auto;margin-top:0;}
  .note{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .error{color:var(--danger);font-size:13px;margin-top:8px;display:none;}
  .hidden{display:none !important;}
  .product-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .product-row img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--cream);}
  .product-row__info{flex:1;min-width:0;}
  .product-row__name{font-weight:700;font-size:14px;}
  .product-row__meta{font-size:12px;color:var(--ink-soft);}
  .product-row__actions{display:flex;gap:6px;flex-shrink:0;}
</style>
</head>
<body>

<header>
  <a href="index.html">← Home</a>
  <h1>🔒 Admin Panel</h1>
</header>

<main>

  <!-- LOGIN -->
  <section class="card" id="loginCard">
    <h2>Admin Login</h2>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="Admin email">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn" id="loginBtn">Login</button>
    <p class="error" id="loginError"></p>
    <p class="note">Admin accounts are created from Firebase Console → Authentication → Users. This page does not allow new sign-ups.</p>
  </section>

  <!-- ADD / EDIT PRODUCT -->
  <section class="card hidden" id="formCard">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="margin:0;" id="formTitle">Add New Product</h2>
      <button class="btn--outline" id="logoutBtn">Logout</button>
    </div>

    <label>Product Type</label>
    <select id="productCategory">
      <option value="fasal">🌾 Fasal (Crop)</option>
      <option value="waste">🌿 Fasal Waste</option>
    </select>

    <label>Product Name</label>
    <input type="text" id="productName" placeholder="e.g. Wheat, Rice Husk">

    <label>Price</label>
    <input type="number" id="productPrice" placeholder="e.g. 2180">

    <label>Unit</label>
    <select id="productUnit">
      <option value="quintal">Quintal</option>
      <option value="kg">Kg</option>
      <option value="ton">Ton</option>
    </select>

    <label>State</label>
    <input type="text" id="productState" placeholder="e.g. Punjab">

    <label>Seller / Farmer Name (shown to buyers)</label>
    <input type="text" id="sellerName" placeholder="e.g. Ramesh Farms">

    <div class="checkbox-row">
      <input type="checkbox" id="productOrganic">
      <label for="productOrganic">This is organic</label>
    </div>

    <label>Product Photo</label>
    <input type="file" id="productImage" accept="image/*">
    <p class="note" id="currentImageNote"></p>

    <button class="btn" id="saveProductBtn">Save Product</button>
    <button class="btn--outline hidden" id="cancelEditBtn" style="margin-top:10px;width:100%;text-align:center;">Cancel Edit</button>
    <p class="note" id="saveStatus"></p>
  </section>

  <!-- ALL PRODUCTS -->
  <section class="card hidden" id="listCard">
    <h2>All Products (<span id="productCount">0</span>)</h2>
    <div id="productsList"><p class="note">No products yet.</p></div>
  </section>

</main>

<script type="module">
import { auth, db, uploadImageToCloudinary } from "./firebase-init.js";
import {
  signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, orderBy, query, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
let editingId = null;
let currentImageUrl = "";

// --- Login ---
$("loginBtn").addEventListener("click", async () => {
  $("loginError").style.display = "none";
  try{
    await signInWithEmailAndPassword(auth, $("loginEmail").value.trim(), $("loginPassword").value);
  }catch(err){
    console.error(err);
    $("loginError").textContent = "Login failed. Check email and password.";
    $("loginError").style.display = "block";
  }
});

$("logoutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if(user){
    $("loginCard").classList.add("hidden");
    $("formCard").classList.remove("hidden");
    $("listCard").classList.remove("hidden");
    watchProducts();
  } else {
    $("loginCard").classList.remove("hidden");
    $("formCard").classList.add("hidden");
    $("listCard").classList.add("hidden");
  }
});

// --- Save (add or update) product ---
$("saveProductBtn").addEventListener("click", async () => {
  const name = $("productName").value.trim();
  const price = $("productPrice").value;
  if(!name || !price){
    $("saveStatus").textContent = "Please fill product name and price.";
    return;
  }
  $("saveProductBtn").disabled = true;
  $("saveStatus").textContent = "Saving...";
  try{
    let imageUrl = currentImageUrl;
    const file = $("productImage").files[0];
    if(file){
      imageUrl = await uploadImageToCloudinary(file);
    }
    const payload = {
      name,
      category: $("productCategory").value,
      price: Number(price),
      unit: $("productUnit").value,
      state: $("productState").value.trim(),
      sellerName: $("sellerName").value.trim() || "Mr Fasal Wala",
      organic: $("productOrganic").checked,
      image: imageUrl,
      addedBy: "admin"
    };
    if(editingId){
      await updateDoc(doc(db, "products", editingId), payload);
      $("saveStatus").textContent = "✅ Product updated!";
    } else {
      payload.createdAt = serverTimestamp();
      await addDoc(collection(db, "products"), payload);
      $("saveStatus").textContent = "✅ Product added!";
    }
    resetForm();
  }catch(err){
    console.error(err);
    $("saveStatus").textContent = "Something went wrong. Please try again.";
  }
  $("saveProductBtn").disabled = false;
});

$("cancelEditBtn").addEventListener("click", resetForm);

function resetForm(){
  editingId = null;
  currentImageUrl = "";
  $("formTitle").textContent = "Add New Product";
  $("productName").value = "";
  $("productPrice").value = "";
  $("productState").value = "";
  $("sellerName").value = "";
  $("productOrganic").checked = false;
  $("productImage").value = "";
  $("currentImageNote").textContent = "";
  $("cancelEditBtn").classList.add("hidden");
}

// --- List all products ---
function watchProducts(){
  const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snap) => {
    $("productCount").textContent = snap.size;
    if(snap.empty){
      $("productsList").innerHTML = '<p class="note">No products yet.</p>';
      return;
    }
    let html = "";
    snap.forEach((docSnap) => {
      const d = docSnap.data();
      html += `
        <div class="product-row">
          <img src="${d.image || ''}" alt="${d.name}">
          <div class="product-row__info">
            <div class="product-row__name">${d.name}</div>
            <div class="product-row__meta">₹${d.price} / ${d.unit} · ${d.category} · ${d.sellerName || ''}</div>
          </div>
          <div class="product-row__actions">
            <button class="btn--outline" data-edit="${docSnap.id}">Edit</button>
            <button class="btn--danger" data-del="${docSnap.id}">Delete</button>
          </div>
        </div>`;
    });
    $("productsList").innerHTML = html;

    document.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => {
        const docSnap = [...snap.docs].find(d => d.id === btn.dataset.edit);
        const d = docSnap.data();
        editingId = docSnap.id;
        currentImageUrl = d.image || "";
        $("formTitle").textContent = "Edit Product";
        $("productCategory").value = d.category || "fasal";
        $("productName").value = d.name || "";
        $("productPrice").value = d.price || "";
        $("productUnit").value = d.unit || "quintal";
        $("productState").value = d.state || "";
        $("sellerName").value = d.sellerName || "";
        $("productOrganic").checked = !!d.organic;
        $("currentImageNote").textContent = d.image ? "Current photo will stay unless you upload a new one." : "";
        $("cancelEditBtn").classList.remove("hidden");
        window.scrollTo({top:0, behavior:"smooth"});
      });
    });

    document.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if(confirm("Delete this product?")){
          await deleteDoc(doc(db, "products", btn.dataset.del));
        }
      });
    });
  });
}
</script>
</body>
</html>
