<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell Your Product | Mr Fasal Wala</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2E7D32">
<link rel="icon" href="icon-192.png">
<style>
  :root{--green:#2E7D32;--green-800:#1B5E20;--cream:#FFF8E1;--ink:#1E2A1E;--ink-soft:#5B6B5B;--line:#E4DCC3;--white:#fff;--danger:#D64545;--radius:14px;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
  header{background:var(--green);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px;}
  header a{color:#fff;text-decoration:none;font-size:14px;opacity:.9;}
  header h1{font-family:'Baloo 2',sans-serif;font-size:19px;margin:0;flex:1;}
  main{max-width:480px;margin:0 auto;padding:20px 16px 60px;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  h2{font-family:'Baloo 2',sans-serif;font-size:18px;margin:0 0 14px;color:var(--green-800);}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;}
  input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;background:#fff;}
  input[type=checkbox]{width:auto;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .checkbox-row label{margin:0;font-weight:500;}
  button{cursor:pointer;border:none;font-family:inherit;}
  .btn{width:100%;padding:13px;border-radius:999px;background:var(--green);color:#fff;font-weight:700;font-size:14.5px;margin-top:16px;}
  .btn:disabled{opacity:.6;}
  .btn--outline{background:#fff;color:var(--danger);border:1.5px solid var(--danger);padding:8px 14px;font-size:12.5px;font-weight:700;border-radius:999px;width:auto;margin-top:0;}
  .note{font-size:12.5px;color:var(--ink-soft);margin-top:8px;}
  .error{color:var(--danger);font-size:13px;margin-top:8px;display:none;}
  .hidden{display:none !important;}
  .product-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .product-row img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--cream);}
  .product-row__info{flex:1;min-width:0;}
  .product-row__name{font-weight:700;font-size:14px;}
  .product-row__meta{font-size:12px;color:var(--ink-soft);}
  #recaptcha-container{margin-top:10px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .phone-badge{font-size:12.5px;color:var(--ink-soft);}
</style>
</head>
<body>

<header>
  <a href="index.html">← Home</a>
  <h1>📷 Sell Your Product</h1>
</header>

<main>

  <!-- STEP 1: PHONE LOGIN -->
  <section class="card" id="loginCard">
    <h2>Login with Mobile Number</h2>
    <div id="phoneStep">
      <label>Mobile Number</label>
      <input type="tel" id="phoneInput" placeholder="10-digit mobile number" maxlength="10">
      <button class="btn" id="sendOtpBtn">Send OTP</button>
      <div id="recaptcha-container"></div>
    </div>
    <div id="otpStep" class="hidden">
      <label>Enter OTP</label>
      <input type="text" id="otpInput" placeholder="6-digit OTP" maxlength="6">
      <button class="btn" id="verifyOtpBtn">Verify & Continue</button>
    </div>
    <p class="error" id="loginError"></p>
  </section>

  <!-- STEP 2: ADD PRODUCT (shown after login) -->
  <section class="card hidden" id="addProductCard">
    <div class="topbar">
      <h2 style="margin:0;">List a New Product</h2>
    </div>
    <p class="phone-badge" id="loggedInPhone"></p>
    <button class="btn--outline" id="logoutBtn" style="margin-bottom:10px;">Logout</button>

    <label>Your Name</label>
    <input type="text" id="sellerName" placeholder="Your full name">

    <label>Product Type</label>
    <select id="productCategory">
      <option value="fasal">🌾 Fasal (Crop)</option>
      <option value="waste">🌿 Fasal Waste</option>
    </select>

    <label>Product Name</label>
    <input type="text" id="productName" placeholder="e.g. Wheat, Rice Husk">

    <label>Price</label>
    <input type="number" id="productPrice" placeholder="e.g. 2180">

    <label>Unit</label>
    <select id="productUnit">
      <option value="quintal">Quintal</option>
      <option value="kg">Kg</option>
      <option value="ton">Ton</option>
    </select>

    <label>State</label>
    <input type="text" id="productState" placeholder="e.g. Punjab">

    <div class="checkbox-row">
      <input type="checkbox" id="productOrganic">
      <label for="productOrganic">This is organic</label>
    </div>

    <label>Product Photo</label>
    <input type="file" id="productImage" accept="image/*" capture="environment">

    <button class="btn" id="submitProductBtn">List My Product</button>
    <p class="note" id="submitStatus"></p>
  </section>

  <!-- STEP 3: MY PRODUCTS -->
  <section class="card hidden" id="myProductsCard">
    <h2>My Listed Products</h2>
    <div id="myProductsList"><p class="note">No products listed yet.</p></div>
  </section>

</main>

<script type="module">
import { auth, db, uploadImageToCloudinary } from "./firebase-init.js";
import {
  RecaptchaVerifier, signInWithPhoneNumber, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  collection, addDoc, deleteDoc, doc, query, where, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const $ = (id) => document.getElementById(id);
let confirmationResult = null;
let unsubscribeMyProducts = null;

function showError(msg){
  $("loginError").textContent = msg;
  $("loginError").style.display = "block";
}

// --- Recaptcha + Send OTP ---
$("sendOtpBtn").addEventListener("click", async () => {
  const phoneDigits = $("phoneInput").value.trim();
  if(!/^[0-9]{10}$/.test(phoneDigits)){
    showError("Please enter a valid 10-digit mobile number.");
    return;
  }
  $("loginError").style.display = "none";
  $("sendOtpBtn").disabled = true;
  $("sendOtpBtn").textContent = "Sending...";
  try{
    if(!window.recaptchaVerifier){
      window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", { size: "invisible" });
    }
    confirmationResult = await signInWithPhoneNumber(auth, "+91" + phoneDigits, window.recaptchaVerifier);
    $("phoneStep").classList.add("hidden");
    $("otpStep").classList.remove("hidden");
  }catch(err){
    console.error(err);
    showError("Could not send OTP. Please try again in a moment.");
    $("sendOtpBtn").disabled = false;
    $("sendOtpBtn").textContent = "Send OTP";
  }
});

// --- Verify OTP ---
$("verifyOtpBtn").addEventListener("click", async () => {
  const code = $("otpInput").value.trim();
  if(!code){ showError("Please enter the OTP."); return; }
  $("loginError").style.display = "none";
  try{
    await confirmationResult.confirm(code);
  }catch(err){
    console.error(err);
    showError("Incorrect OTP. Please try again.");
  }
});

// --- Auth state ---
onAuthStateChanged(auth, (user) => {
  if(user){
    $("loginCard").classList.add("hidden");
    $("addProductCard").classList.remove("hidden");
    $("myProductsCard").classList.remove("hidden");
    $("loggedInPhone").textContent = "Logged in as " + user.phoneNumber;
    watchMyProducts(user.phoneNumber);
  } else {
    $("loginCard").classList.remove("hidden");
    $("addProductCard").classList.add("hidden");
    $("myProductsCard").classList.add("hidden");
    if(unsubscribeMyProducts) unsubscribeMyProducts();
  }
});

$("logoutBtn").addEventListener("click", () => signOut(auth));

// --- Submit new product ---
$("submitProductBtn").addEventListener("click", async () => {
  const name = $("productName").value.trim();
  const price = $("productPrice").value;
  const file = $("productImage").files[0];
  if(!name || !price){
    $("submitStatus").textContent = "Please fill product name and price.";
    return;
  }
  $("submitProductBtn").disabled = true;
  $("submitStatus").textContent = "Uploading...";
  try{
    let imageUrl = "";
    if(file){
      imageUrl = await uploadImageToCloudinary(file);
    }
    await addDoc(collection(db, "products"), {
      name,
      category: $("productCategory").value,
      price: Number(price),
      unit: $("productUnit").value,
      state: $("productState").value.trim(),
      organic: $("productOrganic").checked,
      image: imageUrl,
      sellerName: $("sellerName").value.trim() || "Farmer",
      sellerPhone: auth.currentUser.phoneNumber,
      addedBy: "seller",
      createdAt: serverTimestamp()
    });
    $("submitStatus").textContent = "✅ Product listed successfully!";
    $("productName").value = "";
    $("productPrice").value = "";
    $("productState").value = "";
    $("productImage").value = "";
    $("productOrganic").checked = false;
  }catch(err){
    console.error(err);
    $("submitStatus").textContent = "Something went wrong. Please try again.";
  }
  $("submitProductBtn").disabled = false;
});

// --- My products list ---
function watchMyProducts(phoneNumber){
  if(unsubscribeMyProducts) unsubscribeMyProducts();
  const q = query(collection(db, "products"), where("sellerPhone", "==", phoneNumber));
  unsubscribeMyProducts = onSnapshot(q, (snap) => {
    if(snap.empty){
      $("myProductsList").innerHTML = '<p class="note">No products listed yet.</p>';
      return;
    }
    let html = "";
    snap.forEach((docSnap) => {
      const d = docSnap.data();
      html += `
        <div class="product-row">
          <img src="${d.image || ''}" alt="${d.name}">
          <div class="product-row__info">
            <div class="product-row__name">${d.name}</div>
            <div class="product-row__meta">₹${d.price} / ${d.unit}</div>
          </div>
          <button class="btn--outline" data-del="${docSnap.id}">Remove</button>
        </div>`;
    });
    $("myProductsList").innerHTML = html;
    document.querySelectorAll("[data-del]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if(confirm("Remove this product?")){
          await deleteDoc(doc(db, "products", btn.dataset.del));
        }
      });
    });
  });
}
</script>
</body>
</html>
